<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Transformer in 30s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0B0B10; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Deterministic 30s explainer. render(t) draws the frame at time t (seconds).
const W = 1920, H = 1080, DURATION = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  bg: '#0B0B10', fg: '#F4F1EA', dim: '#7A7A88', faint: '#2A2A35', line: '#1C1C25',
  a: '#FF5A36', b: '#35D0BA', c: '#8C7BFF', d: '#FFC53D',
};
const SANS = '"Noto Sans SC", "Inter", sans-serif';
const LATIN = '"Inter", "Noto Sans SC", sans-serif';
const MONO = '"JetBrains Mono", "Noto Sans SC", monospace';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, s, e) => clamp((t - s) / (e - s));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const eback = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function mix(h1, h2, k) {
  const p = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const a = p(h1), b = p(h2);
  return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',')})`;
}

let A = 1; // alpha of the current scene
const al = x => { ctx.globalAlpha = clamp(A * x); };

const seen = new Set(); // records every string drawn (used to preload font subsets)
function text(str, x, y, o = {}) {
  seen.add(str);
  const { size = 32, weight = 400, color = C.fg, align = 'left', font = SANS, alpha = 1, base = 'alphabetic', ls = 0 } = o;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = base;
  ctx.letterSpacing = ls + 'px';
  al(alpha);
  ctx.fillText(str, x, y);
  ctx.letterSpacing = '0px';
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

// ---------- shared layout ----------
const TOK = ['小猫', '没吃', '鱼', '因为', '它', '饱了'];
const TX = i => 435 + i * 210;
const TW = 170, TH = 76;

function token(i, cy, o = {}) {
  const { alpha = 1, hl = null, scale = 1, dimmed = 0, label = TOK[i], w = TW } = o;
  if (alpha <= 0) return;
  const cx = TX(i);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  rrect(-w / 2, -TH / 2, w, TH, 18);
  al(alpha);
  ctx.fillStyle = hl ? hl : '#15151C';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = hl ? hl : C.faint;
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  text(label, 0, 2, { size: 34, weight: 700, align: 'center', base: 'middle', color: hl ? '#0B0B10' : mix(C.fg, C.dim, dimmed), alpha });
  ctx.restore();
}

function headline(title, sub, lt) {
  const k1 = eout(prog(lt, 0.05, 0.6)), k2 = eout(prog(lt, 0.25, 0.8));
  text(title, 120, 232 + (1 - k1) * 24, { size: 72, weight: 900, alpha: k1 });
  if (sub) text(sub, 122, 292 + (1 - k2) * 16, { size: 32, weight: 400, color: C.dim, alpha: k2 });
}

// Quadratic arc between two token tops. returns point at s∈[0,1]
function arcPt(x0, x1, y, s, k = 1) {
  const h = (70 + Math.abs(x1 - x0) * 0.3) * k;
  const cx = (x0 + x1) / 2, cy = y - 2 * h;
  const u = 1 - s;
  return [u * u * x0 + 2 * u * s * cx + s * s * x1, u * u * y + 2 * u * s * cy + s * s * y];
}
function strokeArc(x0, x1, y, p, width, color, alpha, k = 1) {
  if (p <= 0) return;
  ctx.beginPath();
  const N = 60;
  for (let n = 0; n <= N; n++) {
    const [x, yy] = arcPt(x0, x1, y, (n / N) * p, k);
    n ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
  }
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  al(alpha);
  ctx.stroke();
}

// ---------- background (static) ----------
const bgc = document.createElement('canvas');
bgc.width = W; bgc.height = H;
(() => {
  const g = bgc.getContext('2d');
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  g.fillStyle = '#1B1B24';
  for (let x = 48; x < W; x += 48) for (let y = 48; y < H; y += 48) { g.beginPath(); g.arc(x, y, 1.4, 0, 7); g.fill(); }
  const v = g.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 1200);
  v.addColorStop(0, 'rgba(11,11,16,0)'); v.addColorStop(1, 'rgba(5,5,8,0.85)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
})();

// ================= SCENES =================

// 0 · Title
function sTitle(lt) {
  // ambient attention web
  const nodes = [];
  for (let i = 0; i < 16; i++) nodes.push([160 + rnd(i) * 1600, 140 + rnd(i + 40) * 800]);
  for (let i = 0; i < 16; i++) for (let j = i + 1; j < 16; j++) {
    const r = rnd(i * 31 + j);
    if (r > 0.18) continue;
    const pulse = 0.5 + 0.5 * Math.sin(lt * 2.2 + r * 40);
    ctx.beginPath(); ctx.moveTo(...nodes[i]); ctx.lineTo(...nodes[j]);
    ctx.lineWidth = 1.2; ctx.strokeStyle = C.b; al(0.10 + 0.18 * pulse * prog(lt, 0, 1.2)); ctx.stroke();
  }
  nodes.forEach(([x, y], i) => { ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fillStyle = i % 5 ? C.dim : C.a; al(0.6 * prog(lt, 0, 1)); ctx.fill(); });

  const word = 'Transformer';
  ctx.font = `800 196px ${LATIN}`;
  ctx.letterSpacing = '-6px';
  const total = ctx.measureText(word).width;
  let x = W / 2 - total / 2;
  for (let i = 0; i < word.length; i++) {
    const k = eout(prog(lt, 0.15 + i * 0.045, 0.65 + i * 0.045));
    text(word[i], x, 560 + (1 - k) * 60, { size: 196, weight: 800, font: LATIN, alpha: k, ls: -6, color: i === 0 ? C.a : C.fg });
    ctx.font = `800 196px ${LATIN}`; ctx.letterSpacing = '-6px';
    x += ctx.measureText(word[i]).width;
  }
  ctx.letterSpacing = '0px';
  const kb = eio(prog(lt, 0.9, 1.5));
  al(1); ctx.fillStyle = C.a; ctx.globalAlpha = A;
  ctx.fillRect(W / 2 - total / 2, 604, total * kb, 6);
  const k2 = eout(prog(lt, 1.2, 1.8));
  text('让每个词，都能看见所有词', W / 2, 700 + (1 - k2) * 20, { size: 48, weight: 500, align: 'center', alpha: k2 });
  const k3 = eout(prog(lt, 1.6, 2.2));
  text('ATTENTION IS ALL YOU NEED · 2017', W / 2, 770, { size: 22, font: MONO, align: 'center', color: C.dim, alpha: k3, ls: 6 });
}

// 1 · Why: RNN vs Transformer
function sWhy(lt) {
  headline('从逐字阅读，到一眼看全', '旧方法按顺序读，越读越忘；Transformer 同时处理整句', lt);
  const y1 = 470, y2 = 830;
  // RNN row
  const k0 = prog(lt, 0.2, 0.5);
  text('RNN', 120, y1 - 6, { size: 30, weight: 600, font: MONO, color: C.dim, alpha: k0 });
  text('串行 · 慢', 120, y1 + 30, { size: 22, color: C.dim, alpha: k0 });
  const cur = (lt - 0.4) / 0.32;
  for (let i = 0; i < 6; i++) {
    const on = cur >= i;
    const fade = on ? 0.22 + 0.78 * Math.exp(-(Math.min(cur, 5.8) - i) * 0.7) : 0.35;
    if (i > 0 && cur >= i) {
      al(0.6 * fade); ctx.strokeStyle = C.dim; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(TX(i - 1) + TW / 2 + 6, y1); ctx.lineTo(TX(i) - TW / 2 - 10, y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(TX(i) - TW / 2 - 18, y1 - 6); ctx.lineTo(TX(i) - TW / 2 - 10, y1); ctx.lineTo(TX(i) - TW / 2 - 18, y1 + 6); ctx.stroke();
    }
    const active = on && cur < i + 1 && cur < 6;
    token(i, y1, { alpha: k0 * fade, hl: active ? C.d : null });
  }
  // Transformer row
  const k1 = prog(lt, 1.5, 1.8);
  text('Transformer', 120, y2 - 6, { size: 30, weight: 600, font: MONO, color: C.b, alpha: k1 });
  text('并行 · 直连', 120, y2 + 30, { size: 22, color: C.dim, alpha: k1 });
  const pa = eio(prog(lt, 1.8, 2.8));
  for (let i = 0; i < 6; i++) for (let j = i + 1; j < 6; j++)
    strokeArc(TX(i), TX(j), y2 - TH / 2 - 4, pa, 2, C.b, 0.45, 0.5);
  const pop = eback(prog(lt, 1.55, 2.0));
  for (let i = 0; i < 6; i++) token(i, y2, { alpha: k1, scale: 0.6 + 0.4 * pop, hl: lt > 1.7 && lt < 2.2 ? C.b : null });
}

// 2 · Embedding
const vec = (i, j) => Math.sin(i * 1.7 + j * 2.3) * Math.cos(j * 0.9 + i * 0.4);
function sEmbed(lt) {
  headline('第一步：词 → 向量', '每个词变成一串数字（语义），再叠加位置编码（顺序）', lt);
  const ty = 420;
  for (let i = 0; i < 6; i++) token(i, ty, { alpha: eout(prog(lt, 0.1 + i * 0.05, 0.5 + i * 0.05)) });
  const pe = eio(prog(lt, 2.1, 2.8));
  for (let i = 0; i < 6; i++) for (let j = 0; j < 8; j++) {
    const k = eback(prog(lt, 0.55 + i * 0.07 + j * 0.035, 0.85 + i * 0.07 + j * 0.035));
    if (k <= 0) continue;
    const v = clamp(vec(i, j) + pe * 0.45 * Math.sin(i * 0.9 + j * 1.3), -1, 1);
    const cw = 120, ch = 22, cy = ty + 60 + j * 30;
    ctx.save(); ctx.translate(TX(i), cy + ch / 2); ctx.scale(k, 1);
    rrect(-cw / 2, -ch / 2, cw, ch, 6);
    ctx.fillStyle = v >= 0 ? C.b : C.a; al(0.12 + 0.85 * Math.abs(v)); ctx.fill();
    ctx.restore();
  }
  // positional wave
  const kw = prog(lt, 1.6, 2.3);
  const wy = 790;
  text('+ 位置编码', 120, wy + 10, { size: 26, weight: 500, color: C.d, alpha: kw });
  ctx.beginPath();
  for (let x = TX(0) - 90; x <= TX(0) - 90 + (TX(5) - TX(0) + 180) * eio(kw); x += 4) {
    const y = wy + Math.sin((x - TX(0)) / 210 * 1.4 + lt * 1.2) * 22;
    x === TX(0) - 90 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.lineWidth = 3; ctx.strokeStyle = C.d; al(0.9); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const kk = prog(lt, 1.8 + i * 0.08, 2.1 + i * 0.08);
    const y = wy + Math.sin(1.4 * i + lt * 1.2) * 22;
    ctx.beginPath(); ctx.arc(TX(i), y, 7, 0, 7); ctx.fillStyle = C.d; al(kk); ctx.fill();
    text(`pos ${i + 1}`, TX(i), wy + 64, { size: 20, font: MONO, color: C.dim, align: 'center', alpha: kk });
  }
  text('语义 + 顺序 = 模型真正看到的输入', W / 2, 950, { size: 30, weight: 500, align: 'center', alpha: prog(lt, 2.3, 2.7) });
}

// 3 · Self-attention
const WTS = [0.62, 0.06, 0.12, 0.05, 0, 0.15];
const FX = i => TX(4) + (i - 4) * 14; // spread arc endpoints on the query token
function sAttn(lt) {
  headline('第二步：自注意力', '每个词都在问：“这句话里，谁和我最相关？”', lt);
  const ty = 700, top = ty - TH / 2 - 6, F = 4;
  const kin = prog(lt, 0.1, 0.5);
  const kf = prog(lt, 0.5, 0.9);
  const decide = eio(prog(lt, 2.4, 3.6));
  // arcs
  const grow = eio(prog(lt, 1.0, 2.3));
  for (let i = 0; i < 6; i++) {
    if (i === F) continue;
    const w = WTS[i];
    const width = lerp(2.5, 2 + w * 26, decide);
    const col = i === 0 ? mix(C.fg, C.a, decide) : mix(C.fg, C.dim, decide);
    strokeArc(FX(i), TX(i), top, grow, width, col, lerp(0.5, 0.35 + w, decide));
    // weight under each key: number + bar
    const kl = prog(lt, 2.5, 2.9);
    const kw = eout(prog(lt, 2.5, 3.5));
    const hot = i === 0;
    text(Math.round(w * 100 * kw) + '%', TX(i), ty + 128, { size: hot ? 36 : 26, weight: 700, font: MONO, align: 'center', color: hot ? C.a : C.dim, alpha: kl });
    rrect(TX(i) - 60, ty + 148, 120, 6, 3); ctx.fillStyle = C.faint; al(kl); ctx.fill();
    rrect(TX(i) - 60, ty + 148, Math.max(1, 120 * (w / 0.62) * kw), 6, 3); ctx.fillStyle = hot ? C.a : C.dim; al(kl); ctx.fill();
  }
  // value particles flowing into 它
  const kv = prog(lt, 4.0, 4.4) * (1 - prog(lt, 7.2, 7.8));
  if (kv > 0) for (let i = 0; i < 6; i++) {
    if (i === F) continue;
    const n = Math.max(1, Math.round(WTS[i] * 16));
    for (let m = 0; m < n; m++) {
      const s = ((lt - 4.0) * 0.7 + m / n) % 1;
      const [px, py] = arcPt(TX(i), FX(i), top, s);
      ctx.beginPath(); ctx.arc(px, py, i === 0 ? 7 : 5, 0, 7);
      ctx.fillStyle = i === 0 ? C.a : C.fg; al(kv * Math.sin(s * Math.PI)); ctx.fill();
    }
  }
  // tokens
  const tint = eio(prog(lt, 4.6, 5.6));
  for (let i = 0; i < 6; i++) {
    let hl = null;
    if (i === F && kf > 0) hl = mix(C.d, C.a, tint);
    if (i === 0) hl = decide > 0.5 ? hexA(C.a, 0.25 + 0.75 * (decide - 0.5) * 2) : null;
    token(i, ty, { alpha: kin, hl, dimmed: i !== F && i !== 0 ? decide * 0.6 : 0, scale: i === F ? 1 + 0.08 * eback(kf) - 0.08 * kf : 1 });
  }
  // Q / K / V tags
  const kt = prog(lt, 0.7, 1.1) * (1 - prog(lt, 6.8, 7.2) * 0);
  for (let i = 0; i < 6; i++) {
    const isF = i === F;
    text(isF ? 'Query 查询' : 'Key', TX(i), ty + 72, { size: 20, font: MONO, align: 'center', color: isF ? C.d : C.dim, alpha: kt, weight: isF ? 600 : 400 });
  }
  const kr = eout(prog(lt, 5.2, 5.7));
  text('「它」指的是「小猫」', W / 2, ty + 215 + (1 - kr) * 12, { size: 34, weight: 700, color: C.a, align: 'center', alpha: kr });
  // formula
  const kfm = eout(prog(lt, 5.8, 6.4));
  text('Attention(Q, K, V) = softmax( QKᵀ / √d ) · V', W / 2, 985 + (1 - kfm) * 14, { size: 28, font: MONO, weight: 600, align: 'center', alpha: kfm });
}

// 4 · Multi-head
const HEADS = [
  { name: '指代', col: C.a, f: (i, j) => (i === 4 && j === 0) ? .95 : (i === 5 && j === 0) ? .45 : i === j ? .25 : .05 },
  { name: '相邻', col: C.b, f: (i, j) => Math.abs(i - j) === 1 ? .75 : i === j ? .45 : .04 },
  { name: '因果', col: C.c, f: (i, j) => (i === 3 && (j === 1 || j === 5)) ? .9 : (i === 5 && j === 1) ? .6 : (i === 1 && j === 5) ? .5 : i === j ? .2 : .05 },
  { name: '动宾', col: C.d, f: (i, j) => (i === 1 && j === 2) ? .92 : (i === 0 && j === 1) ? .7 : (i === 4 && j === 5) ? .75 : (i === 2 && j === 1) ? .45 : i === j ? .2 : .05 },
];
function sHeads(lt) {
  headline('多头注意力', '多个“头”并行工作，各自捕捉一种关系，最后拼接融合', lt);
  const cs = 44, gap = 6, size = 6 * cs - gap, hg = 96;
  const x0 = (W - (4 * size + 3 * hg)) / 2, y0 = 440;
  HEADS.forEach((h, n) => {
    const x = x0 + n * (size + hg);
    const kl = eout(prog(lt, 0.25 + n * 0.18, 0.7 + n * 0.18));
    text(`HEAD ${n + 1}`, x, y0 - 50, { size: 18, font: MONO, color: C.dim, alpha: kl, ls: 3 });
    text(h.name, x + size, y0 - 48, { size: 30, weight: 700, color: h.col, align: 'right', alpha: kl });
    for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) {
      const k = eback(prog(lt, 0.35 + n * 0.18 + (i + j) * 0.03, 0.7 + n * 0.18 + (i + j) * 0.03));
      if (k <= 0) continue;
      const cx = x + j * cs + (cs - gap) / 2, cy = y0 + i * cs + (cs - gap) / 2;
      const s = (cs - gap) * k;
      rrect(cx - s / 2, cy - s / 2, s, s, 6);
      ctx.fillStyle = hexA(h.col, 0.07 + 0.93 * h.f(i, j)); al(1); ctx.fill();
    }
    if (n === 0) for (let i = 0; i < 6; i++)
      text(TOK[i], x - 14, y0 + i * cs + (cs - gap) / 2 + 1, { size: 18, align: 'right', base: 'middle', color: C.dim, alpha: kl });
    // merge lines
    const km = eio(prog(lt, 1.7, 2.4));
    if (km > 0) {
      const sx = x + size / 2, sy = y0 + size + 16, ex = W / 2, ey = 900;
      ctx.beginPath(); ctx.moveTo(sx, sy);
      const mx = lerp(sx, ex, km), my = lerp(sy, ey - 30, km);
      ctx.bezierCurveTo(sx, lerp(sy, ey, 0.6 * km), mx, lerp(sy, ey - 60, km), mx, my);
      ctx.lineWidth = 3; ctx.strokeStyle = h.col; al(0.7); ctx.stroke();
    }
  });
  const kp = eback(prog(lt, 2.3, 2.7));
  if (kp > 0) {
    ctx.save(); ctx.translate(W / 2, 900); ctx.scale(kp, kp);
    rrect(-150, -34, 300, 68, 34); ctx.fillStyle = C.fg; al(1); ctx.fill();
    text('拼接 · 融合', 0, 2, { size: 30, weight: 700, color: C.bg, align: 'center', base: 'middle' });
    ctx.restore();
  }
}

// 5 · Stack
function sStack(lt) {
  headline('第三步：层层堆叠', '“注意力 + 前馈网络”组成一层，重复 N 次，理解逐层加深', lt);
  const bw = 720, bh = 88, cx = W / 2 - 60, layers = 5;
  const yb = 940;
  const scan = lerp(-0.5, layers + 0.3, eio(prog(lt, 0.9, 2.8)));
  for (let l = 0; l < layers; l++) {
    const k = eout(prog(lt, 0.15 + l * 0.12, 0.55 + l * 0.12));
    if (k <= 0) continue;
    const y = yb - l * (bh + 18) - bh + (1 - k) * 40;
    const lit = Math.exp(-Math.pow((scan - l - 0.5) * 1.6, 2));
    rrect(cx - bw / 2, y, bw, bh, 16);
    ctx.fillStyle = mix('#15151C', C.a, lit * 0.9); al(k); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = mix(C.faint, C.a, lit); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, y + 18); ctx.lineTo(cx, y + bh - 18); ctx.strokeStyle = hexA(C.fg, 0.15); ctx.stroke();
    const tc = mix(C.fg, C.bg, lit);
    text('多头注意力', cx - bw / 4, y + bh / 2 + 2, { size: 30, weight: 700, align: 'center', base: 'middle', color: tc, alpha: k });
    text('前馈网络', cx + bw / 4, y + bh / 2 + 2, { size: 30, weight: 700, align: 'center', base: 'middle', color: tc, alpha: k });
    text('+ 残差 · 归一化', cx + bw / 2 + 24, y + bh / 2 + 2, { size: 20, base: 'middle', color: C.dim, alpha: k * 0.9 });
  }
  // left axis: shallow → deep
  const ka = eout(prog(lt, 0.8, 1.3));
  const ax = cx - bw / 2 - 90, top = yb - layers * (bh + 18) + 18;
  ctx.beginPath(); ctx.moveTo(ax, yb - 10); ctx.lineTo(ax, lerp(yb - 10, top, ka));
  ctx.lineWidth = 3; ctx.strokeStyle = C.dim; al(ka); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ax - 10, top + 14); ctx.lineTo(ax, top); ctx.lineTo(ax + 10, top + 14); al(ka > 0.95 ? 1 : 0); ctx.stroke();
  text('词法', ax - 20, yb - 30, { size: 24, align: 'right', color: C.dim, alpha: ka });
  text('语义', ax - 20, top + 30, { size: 24, weight: 700, align: 'right', color: C.fg, alpha: ka });
  const kn = eback(prog(lt, 1.2, 1.6));
  text('× N', cx + bw / 2 + 210, yb - 250, { size: 110, weight: 800, font: LATIN, color: C.a, alpha: clamp(kn), ls: -2 });
}

// 6 · Output
const OUT = [['饱了', 0.71], ['不饿', 0.14], ['生病了', 0.08], ['挑食', 0.05]];
function sOut(lt) {
  headline('第四步：预测下一个词', '最后一层输出一个概率分布，挑出最可能的词', lt);
  const k0 = eout(prog(lt, 0.2, 0.6));
  const sy = 470;
  ctx.font = `700 60px ${SANS}`;
  const pre = '小猫没吃鱼，因为它';
  const pw = ctx.measureText(pre).width;
  const sx = W / 2 - (pw + 150) / 2;
  text(pre, sx, sy, { size: 60, weight: 700, alpha: k0 });
  const kf = eback(prog(lt, 1.6, 2.0));
  if (lt < 1.7) { al(k0 * (0.5 + 0.5 * Math.sin(lt * 12) > 0 ? 1 : 0)); ctx.fillStyle = C.dim; ctx.fillRect(sx + pw + 12, sy + 10, 130, 5); }
  if (kf > 0) {
    ctx.save(); ctx.translate(sx + pw + 12 + 65, sy - 22); ctx.scale(kf, kf);
    text('饱了', 0, 22, { size: 60, weight: 900, color: C.a, align: 'center' });
    ctx.restore();
  }
  OUT.forEach(([w, p], i) => {
    const y = 600 + i * 78;
    const k = eout(prog(lt, 0.4 + i * 0.08, 1.2 + i * 0.08));
    text(w, 740, y + 12, { size: 34, weight: i ? 400 : 700, align: 'right', color: i ? C.dim : C.fg, alpha: prog(lt, 0.3 + i * 0.08, 0.6 + i * 0.08) });
    const bw = 720 * p * k;
    rrect(770, y - 18, Math.max(bw, 1), 40, 8);
    ctx.fillStyle = i ? hexA(C.fg, 0.18) : C.a; al(1); ctx.fill();
    text(Math.round(p * 100 * k) + '%', 790 + bw, y + 11, { size: 26, font: MONO, weight: 600, color: i ? C.dim : C.a, alpha: k });
  });
}

// 7 · Summary
function sEnd(lt) {
  const steps = ['向量化', '自注意力', '堆叠 × N', '预测'];
  ctx.font = `600 30px ${SANS}`;
  const ws = steps.map(s => ctx.measureText(s).width + 56);
  const arrow = 60, tot = ws.reduce((a, b) => a + b, 0) + arrow * 3;
  let x = W / 2 - tot / 2;
  steps.forEach((s, i) => {
    const k = eback(prog(lt, 0.05 + i * 0.12, 0.45 + i * 0.12));
    if (k > 0) {
      ctx.save(); ctx.translate(x + ws[i] / 2, 380); ctx.scale(k, k);
      rrect(-ws[i] / 2, -32, ws[i], 64, 32);
      ctx.lineWidth = 2; ctx.strokeStyle = i === 1 ? C.a : C.faint; ctx.fillStyle = i === 1 ? hexA(C.a, 0.15) : '#15151C'; al(1); ctx.fill(); ctx.stroke();
      text(s, 0, 2, { size: 30, weight: 600, align: 'center', base: 'middle', color: i === 1 ? C.a : C.fg });
      ctx.restore();
    }
    x += ws[i];
    if (i < 3) text('→', x + arrow / 2, 382, { size: 30, align: 'center', base: 'middle', color: C.dim, alpha: prog(lt, 0.2 + i * 0.12, 0.4 + i * 0.12) });
    x += arrow;
  });
  const k = eout(prog(lt, 0.3, 0.9));
  text('注意力  ·  并行  ·  堆叠', W / 2, 580 + (1 - k) * 24, { size: 92, weight: 900, align: 'center', alpha: k });
  const k2 = eout(prog(lt, 0.6, 1.1));
  text('GPT、BERT 等现代大模型的共同基石', W / 2, 670, { size: 36, weight: 400, align: 'center', color: C.dim, alpha: k2 });
}

const SCENES = [
  { s: 0.0, e: 3.4, f: sTitle, ch: '' },
  { s: 3.4, e: 7.2, f: sWhy, ch: '00 · WHY' },
  { s: 7.2, e: 10.6, f: sEmbed, ch: '01 · EMBEDDING' },
  { s: 10.6, e: 18.4, f: sAttn, ch: '02 · SELF-ATTENTION' },
  { s: 18.4, e: 22.0, f: sHeads, ch: '02 · MULTI-HEAD' },
  { s: 22.0, e: 25.2, f: sStack, ch: '03 · LAYERS' },
  { s: 25.2, e: 28.0, f: sOut, ch: '04 · OUTPUT' },
  { s: 28.0, e: 30.0, f: sEnd, ch: 'SUMMARY' },
];

function render(t) {
  ctx.globalAlpha = 1;
  ctx.drawImage(bgc, 0, 0);
  for (let n = 0; n < SCENES.length; n++) {
    const sc = SCENES[n];
    const first = n === 0, last = n === SCENES.length - 1;
    const aIn = first ? 1 : prog(t, sc.s - 0.1, sc.s + 0.3);
    const aOut = last ? 1 - prog(t, 29.4, 29.95) : 1 - prog(t, sc.e - 0.3, sc.e + 0.1);
    A = Math.min(aIn, aOut);
    if (A <= 0) continue;
    ctx.save();
    sc.f(t - sc.s, sc.e - sc.s);
    ctx.restore();
    if (sc.ch) {
      text(sc.ch, 120, 110, { size: 20, font: MONO, weight: 600, color: C.a, ls: 4 });
    }
  }
  // chrome: brand + progress
  A = 1 - prog(t, 29.4, 29.95);
  text('TRANSFORMER / 30s', W - 120, 110, { size: 18, font: MONO, color: C.dim, align: 'right', ls: 4, alpha: prog(t, 3.2, 3.6) });
  al(0.8); ctx.fillStyle = C.line; ctx.fillRect(120, 1030, W - 240, 3);
  al(1); ctx.fillStyle = C.a; ctx.fillRect(120, 1030, (W - 240) * (t / DURATION), 3);
  ctx.globalAlpha = 1;
}

// Preload every glyph subset we draw, then mark ready.
window.ready = (async () => {
  for (let t = 0; t <= DURATION; t += 0.05) render(t);
  const all = [...seen].join('') + 'ᵀ√·→×';
  await document.fonts.ready;
  const specs = [];
  for (const w of [400, 500, 600, 700, 800, 900]) specs.push(`${w} 40px "Noto Sans SC"`, `${w} 40px "Inter"`);
  specs.push('400 40px "JetBrains Mono"', '600 40px "JetBrains Mono"');
  await Promise.all(specs.map(s => document.fonts.load(s, all).catch(() => {})));
  await document.fonts.ready;
  render(0);
  return true;
})();
window.render = render;

// Live preview when opened in a browser (not while rendering frames).
if (!navigator.webdriver) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; };
  addEventListener('resize', fit); fit();
}
</script>
