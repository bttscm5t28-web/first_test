<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>接色方块 · Catch the Color</title>
<style>
  :root{
    --bg-a:#0f1020;
    --bg-b:#1a1030;
    --panel:rgba(255,255,255,0.06);
    --text:#f4f4fb;
    --muted:#9a97b8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg-a);
    color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
  }
  #game-wrap{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  canvas{
    display:block;
    background:linear-gradient(180deg,var(--bg-a),var(--bg-b));
    max-width:100vw; max-height:100vh;
  }
  .hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px;
    pointer-events:none;
    z-index:5;
  }
  .hud-left, .hud-right{
    display:flex; align-items:center; gap:10px;
  }
  .pill{
    background:var(--panel);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:999px;
    padding:8px 14px;
    font-size:14px;
    display:flex; align-items:center; gap:8px;
  }
  #score-val{font-weight:700; font-size:18px;}
  #combo-val{color:#ffd85c; font-weight:700;}
  .lives{display:flex; gap:4px;}
  .life-dot{
    width:12px; height:12px; border-radius:50%;
    background:#ff5c7a;
    box-shadow:0 0 8px #ff5c7a99;
  }
  .life-dot.lost{background:#33324a; box-shadow:none;}
  #target-swatch{
    width:22px; height:22px; border-radius:7px;
    box-shadow:0 0 12px currentColor;
    transition:background-color .25s ease;
  }
  #target-timer{
    width:60px; height:6px; border-radius:3px;
    background:rgba(255,255,255,0.15);
    overflow:hidden;
  }
  #target-timer-fill{
    height:100%; width:100%;
    background:#fff;
    transform-origin:left;
    transition:transform .1s linear, background-color .25s ease;
  }
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
    background:rgba(10,8,20,0.72);
    backdrop-filter:blur(4px);
    z-index:10;
    text-align:center;
    padding:20px;
  }
  .overlay.hidden{display:none;}
  .title{
    font-size:clamp(28px,7vw,44px);
    font-weight:800;
    letter-spacing:2px;
    background:linear-gradient(90deg,#ff5c7a,#ffd85c,#5cffb0,#5cc8ff,#c78cff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    background-size:300% 100%;
    animation:hue-slide 6s linear infinite;
  }
  @keyframes hue-slide{
    0%{background-position:0% 50%;}
    100%{background-position:300% 50%;}
  }
  .subtitle{color:var(--muted); font-size:15px; max-width:420px; line-height:1.7;}
  .btn{
    pointer-events:auto;
    cursor:pointer;
    border:none;
    padding:14px 36px;
    font-size:17px;
    font-weight:700;
    border-radius:999px;
    background:linear-gradient(90deg,#5c9dff,#7a5cff);
    color:#fff;
    box-shadow:0 6px 24px rgba(92,157,255,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 10px 28px rgba(92,157,255,0.45);}
  .btn:active{transform:translateY(0px) scale(0.97);}
  .stat-row{display:flex; gap:28px; margin:4px 0 8px;}
  .stat{display:flex; flex-direction:column; align-items:center;}
  .stat .num{font-size:26px; font-weight:800;}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
  .hint-row{
    display:flex; gap:18px; flex-wrap:wrap; justify-content:center;
    font-size:12.5px; color:var(--muted); max-width:460px;
  }
  .hint-row span{display:flex; align-items:center; gap:6px;}
  .key{
    display:inline-block; padding:2px 8px; border-radius:5px;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.18);
    font-family:monospace; font-size:12px;
  }
  .flash{
    position:absolute; inset:0; pointer-events:none; z-index:6;
    opacity:0;
  }
  #pause-hint{
    position:absolute; bottom:14px; left:0; right:0;
    text-align:center; font-size:12px; color:var(--muted);
    z-index:5; pointer-events:none;
  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="hud-left">
      <div class="pill">
        <span>分数</span><span id="score-val">0</span>
      </div>
      <div class="pill">
        连击 <span id="combo-val">x1</span>
      </div>
    </div>
    <div class="hud-right">
      <div class="pill">
        <span id="target-swatch"></span>
        <div id="target-timer"><div id="target-timer-fill"></div></div>
      </div>
      <div class="pill lives" id="lives-box"></div>
    </div>
  </div>

  <div id="pause-hint">按 <span class="key">P</span> 暂停</div>
  <div class="flash" id="flash"></div>

  <div class="overlay" id="start-overlay">
    <div class="title">接色方块</div>
    <div class="subtitle">
      顶部会显示<b>目标颜色</b>，只接住和目标颜色相同的方块得分；接错颜色会失去一条生命。
      目标颜色会不断切换，节奏也会越来越快 —— 看你能撑到多少分！
    </div>
    <button class="btn" id="start-btn">开始游戏</button>
    <div class="hint-row">
      <span><span class="key">←</span><span class="key">→</span> 或 <span class="key">A</span><span class="key">D</span> 移动挡板</span>
      <span>鼠标 / 触摸拖动也可以</span>
      <span><span class="key">P</span> 暂停 / 继续</span>
    </div>
  </div>

  <div class="overlay hidden" id="gameover-overlay">
    <div class="title" style="font-size:clamp(24px,6vw,36px);">游戏结束</div>
    <div class="stat-row">
      <div class="stat"><div class="num" id="final-score">0</div><div class="lbl">本局分数</div></div>
      <div class="stat"><div class="num" id="best-score">0</div><div class="lbl">最高分</div></div>
      <div class="stat"><div class="num" id="final-combo">x1</div><div class="lbl">最高连击</div></div>
    </div>
    <button class="btn" id="restart-btn">再来一局</button>
  </div>

  <div class="overlay hidden" id="pause-overlay">
    <div class="title" style="font-size:clamp(24px,6vw,36px);">已暂停</div>
    <button class="btn" id="resume-btn">继续游戏</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- Setup ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('game-wrap');

  const COLORS = [
    {name:'red',    hex:'#ff5c7a'},
    {name:'blue',   hex:'#5cc8ff'},
    {name:'green',  hex:'#5cffb0'},
    {name:'yellow', hex:'#ffd85c'},
    {name:'purple', hex:'#c78cff'},
  ];

  const HIGH_SCORE_KEY = 'catchColor_highscore_v1';

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;

  function resize(){
    const maxW = Math.min(window.innerWidth, 520);
    const maxH = window.innerHeight;
    W = maxW; H = maxH;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Game State ----------
  const STATE = { START:'start', PLAYING:'playing', PAUSED:'paused', OVER:'over' };
  let state = STATE.START;

  let paddle, blocks, particles, score, combo, maxCombo, lives, targetColorIdx,
      targetTimer, targetInterval, spawnTimer, spawnInterval, fallSpeed,
      elapsed, shakeTime, shakeMag;

  function resetGame(){
    paddle = {
      w: Math.max(70, W*0.22),
      h: 16,
      x: W/2,
      targetX: W/2,
      speed: 620,
    };
    blocks = [];
    particles = [];
    score = 0;
    combo = 1;
    maxCombo = 1;
    lives = 3;
    targetColorIdx = Math.floor(Math.random()*COLORS.length);
    targetInterval = 6.0;
    targetTimer = targetInterval;
    spawnTimer = 0;
    spawnInterval = 1.05;
    fallSpeed = 130;
    elapsed = 0;
    shakeTime = 0; shakeMag = 0;
    updateHUD(true);
  }

  // ---------- Input ----------
  const keys = {left:false, right:false};
  window.addEventListener('keydown', (e)=>{
    if(e.repeat) return;
    if(e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
    if(e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;
    if(e.key.toLowerCase() === 'p' || e.key === 'Escape'){
      if(state === STATE.PLAYING) pauseGame();
      else if(state === STATE.PAUSED) resumeGame();
    }
    if(e.key === ' ' && state === STATE.START){ startGame(); }
  });
  window.addEventListener('keyup', (e)=>{
    if(e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
    if(e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
  });

  let pointerActive = false;
  function pointerToLocalX(clientX){
    const rect = canvas.getBoundingClientRect();
    return clientX - rect.left;
  }
  wrap.addEventListener('mousedown', (e)=>{
    pointerActive = true;
    if(paddle) paddle.targetX = pointerToLocalX(e.clientX);
  });
  window.addEventListener('mousemove', (e)=>{
    if(pointerActive && paddle) paddle.targetX = pointerToLocalX(e.clientX);
  });
  window.addEventListener('mouseup', ()=> pointerActive = false);

  wrap.addEventListener('touchstart', (e)=>{
    pointerActive = true;
    const t = e.touches[0];
    if(t && paddle) paddle.targetX = pointerToLocalX(t.clientX);
  }, {passive:true});
  wrap.addEventListener('touchmove', (e)=>{
    const t = e.touches[0];
    if(t && paddle) paddle.targetX = pointerToLocalX(t.clientX);
  }, {passive:true});
  wrap.addEventListener('touchend', ()=> pointerActive = false);

  // ---------- HUD ----------
  const scoreVal = document.getElementById('score-val');
  const comboVal = document.getElementById('combo-val');
  const targetSwatch = document.getElementById('target-swatch');
  const targetTimerFill = document.getElementById('target-timer-fill');
  const livesBox = document.getElementById('lives-box');
  const flashEl = document.getElementById('flash');

  function updateHUD(forceLives){
    scoreVal.textContent = score;
    comboVal.textContent = 'x' + combo;
    const col = COLORS[targetColorIdx];
    targetSwatch.style.backgroundColor = col.hex;
    targetSwatch.style.color = col.hex;
    if(forceLives){
      livesBox.innerHTML = '';
      for(let i=0;i<3;i++){
        const d = document.createElement('div');
        d.className = 'life-dot';
        livesBox.appendChild(d);
      }
    }
  }
  function refreshLivesDots(){
    const dots = livesBox.querySelectorAll('.life-dot');
    dots.forEach((d, i)=>{
      d.classList.toggle('lost', i >= lives);
    });
  }

  function flash(color){
    flashEl.style.transition = 'none';
    flashEl.style.background = color;
    flashEl.style.opacity = '0.35';
    requestAnimationFrame(()=>{
      flashEl.style.transition = 'opacity .35s ease';
      flashEl.style.opacity = '0';
    });
  }

  // ---------- Particles ----------
  function spawnBurst(x, y, hex, n){
    for(let i=0;i<n;i++){
      const ang = Math.random()*Math.PI*2;
      const spd = 60 + Math.random()*160;
      particles.push({
        x, y,
        vx: Math.cos(ang)*spd,
        vy: Math.sin(ang)*spd,
        life: 0.5 + Math.random()*0.4,
        age: 0,
        size: 2 + Math.random()*3,
        hex
      });
    }
  }

  // ---------- Blocks ----------
  function spawnBlock(){
    const size = 30 + Math.random()*14;
    const colIdx = Math.floor(Math.random()*COLORS.length);
    blocks.push({
      x: size/2 + Math.random()*(W - size),
      y: -size,
      size,
      colIdx,
      vy: fallSpeed * (0.85 + Math.random()*0.3),
      caught:false,
    });
  }

  // ---------- Game flow ----------
  function startGame(){
    resetGame();
    state = STATE.PLAYING;
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('gameover-overlay').classList.add('hidden');
    document.getElementById('pause-overlay').classList.add('hidden');
    refreshLivesDots();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function pauseGame(){
    if(state !== STATE.PLAYING) return;
    state = STATE.PAUSED;
    document.getElementById('pause-overlay').classList.remove('hidden');
  }
  function resumeGame(){
    if(state !== STATE.PAUSED) return;
    state = STATE.PLAYING;
    document.getElementById('pause-overlay').classList.add('hidden');
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver(){
    state = STATE.OVER;
    const best = Math.max(maxCombo >= 0 ? score : score, Number(localStorage.getItem(HIGH_SCORE_KEY) || 0));
    const prevBest = Number(localStorage.getItem(HIGH_SCORE_KEY) || 0);
    const newBest = Math.max(prevBest, score);
    localStorage.setItem(HIGH_SCORE_KEY, String(newBest));
    document.getElementById('final-score').textContent = score;
    document.getElementById('best-score').textContent = newBest;
    document.getElementById('final-combo').textContent = 'x' + maxCombo;
    document.getElementById('gameover-overlay').classList.remove('hidden');
  }

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);
  document.getElementById('resume-btn').addEventListener('click', resumeGame);

  // ---------- Update ----------
  function update(dt){
    elapsed += dt;

    // difficulty ramp
    spawnInterval = Math.max(0.34, 1.05 - elapsed*0.012);
    fallSpeed = Math.min(430, 130 + elapsed*7);

    // paddle movement
    if(keys.left) paddle.targetX -= paddle.speed*dt;
    if(keys.right) paddle.targetX += paddle.speed*dt;
    paddle.targetX = Math.max(paddle.w/2, Math.min(W - paddle.w/2, paddle.targetX));
    paddle.x += (paddle.targetX - paddle.x) * Math.min(1, dt*16);

    // target color timer
    targetTimer -= dt;
    if(targetTimer <= 0){
      let next = targetColorIdx;
      while(next === targetColorIdx) next = Math.floor(Math.random()*COLORS.length);
      targetColorIdx = next;
      targetInterval = Math.max(3.2, targetInterval - 0.05);
      targetTimer = targetInterval;
      updateHUD(false);
    }
    const frac = Math.max(0, targetTimer/targetInterval);
    targetTimerFill.style.transform = `scaleX(${frac})`;
    targetTimerFill.style.backgroundColor = frac < 0.2 ? '#ff5c7a' : '#ffffff';

    // spawn blocks
    spawnTimer -= dt;
    if(spawnTimer <= 0){
      spawnBlock();
      spawnTimer = spawnInterval;
    }

    // update blocks
    const paddleTop = H - 70;
    for(let i = blocks.length - 1; i >= 0; i--){
      const b = blocks[i];
      b.y += b.vy * dt;

      // collision with paddle
      if(!b.caught && b.y + b.size/2 >= paddleTop && b.y - b.size/2 <= paddleTop + paddle.h){
        const withinX = (b.x + b.size/2 > paddle.x - paddle.w/2) && (b.x - b.size/2 < paddle.x + paddle.w/2);
        if(withinX){
          b.caught = true;
          const col = COLORS[b.colIdx];
          if(b.colIdx === targetColorIdx){
            combo += 1;
            maxCombo = Math.max(maxCombo, combo);
            const gained = 10 * Math.min(combo, 8);
            score += gained;
            spawnBurst(b.x, paddleTop, col.hex, 16);
          } else {
            combo = 1;
            lives -= 1;
            refreshLivesDots();
            flash('rgba(255,60,90,0.5)');
            shakeTime = 0.28; shakeMag = 9;
            spawnBurst(b.x, paddleTop, col.hex, 10);
            if(lives <= 0){
              updateHUD(false);
              blocks.splice(i,1);
              gameOver();
              return;
            }
          }
          updateHUD(false);
          blocks.splice(i,1);
          continue;
        }
      }

      // missed: reset combo if it was the target color and it fell past
      if(b.y - b.size/2 > H){
        if(b.colIdx === targetColorIdx && combo > 1){
          combo = 1;
          updateHUD(false);
        }
        blocks.splice(i,1);
      }
    }

    // particles
    for(let i = particles.length-1; i>=0; i--){
      const p = particles[i];
      p.age += dt;
      if(p.age >= p.life){ particles.splice(i,1); continue; }
      p.x += p.vx*dt;
      p.y += p.vy*dt;
      p.vy += 260*dt;
    }

    if(shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);
  }

  // ---------- Draw ----------
  function draw(){
    ctx.clearRect(0,0,W,H);

    // background subtle glow tied to target color
    const col = COLORS[targetColorIdx];
    const grad = ctx.createRadialGradient(W/2, H*0.15, 20, W/2, H*0.15, W*0.9);
    grad.addColorStop(0, hexWithAlpha(col.hex, 0.14));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    let ox = 0, oy = 0;
    if(shakeTime > 0){
      ox = (Math.random()*2-1)*shakeMag*(shakeTime/0.28);
      oy = (Math.random()*2-1)*shakeMag*(shakeTime/0.28);
    }
    ctx.save();
    ctx.translate(ox, oy);

    // blocks
    for(const b of blocks){
      const c = COLORS[b.colIdx].hex;
      ctx.save();
      ctx.translate(b.x, b.y);
      const isTarget = b.colIdx === targetColorIdx;
      ctx.shadowColor = c;
      ctx.shadowBlur = isTarget ? 18 : 6;
      ctx.fillStyle = c;
      roundRect(ctx, -b.size/2, -b.size/2, b.size, b.size, 8);
      ctx.fill();
      ctx.restore();
    }

    // paddle
    const paddleTop = H - 70;
    ctx.save();
    ctx.shadowColor = col.hex;
    ctx.shadowBlur = 20;
    ctx.fillStyle = col.hex;
    roundRect(ctx, paddle.x - paddle.w/2, paddleTop, paddle.w, paddle.h, 8);
    ctx.fill();
    ctx.restore();

    // particles
    for(const p of particles){
      const t = 1 - p.age/p.life;
      ctx.globalAlpha = Math.max(0,t);
      ctx.fillStyle = p.hex;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*t, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function hexWithAlpha(hex, alpha){
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ---------- Loop ----------
  let lastTime = performance.now();
  function loop(now){
    if(state !== STATE.PLAYING) return;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    dt = Math.min(dt, 0.05); // avoid spiral of death on tab switch
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // initial static frame
  resetGame();
  draw();
})();
</script>
</body>
</html>
